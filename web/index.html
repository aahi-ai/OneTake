<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>onetake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <span class="mark">onetake</span>
  <nav>
    <button class="nv on" data-go="rec">record</button>
    <button class="nv" data-go="up">upload</button>
  </nav>
</header>

<main>

  <section class="pg on" id="pg-rec">
    <div class="frame">
      <video id="preview" autoplay muted playsinline></video>
      <div class="tag"><i id="dot"></i><span class="num" id="rt">0:00</span></div>
      <div class="idle" id="idle">camera off</div>
    </div>
    <div class="row">
      <button class="go" id="btn">start recording</button>
      <span class="hint" id="hint">flub a line? say it again — only the last one survives</span>
    </div>
  </section>

  <section class="pg" id="pg-up">
    <button id="zone">
      <span class="zone-a">↓</span>
      <span class="zone-b">choose a file</span>
      <span class="zone-c">mp4 · mov · webm · wav · mp3</span>
    </button>
    <input type="file" id="file" accept="video/*,audio/*" hidden>
  </section>

  <section class="pg" id="pg-work">
    <div class="work">
      <div class="work-r"><span class="num" id="w-st">queued</span><span class="num" id="w-pc">0%</span></div>
      <div class="work-t"><div id="w-fl"></div></div>
    </div>
  </section>

  <section class="pg" id="pg-out">
    <video id="out" controls playsinline></video>
    <div class="reel" id="reel"></div>
    <div class="stat num" id="stat">—</div>

    <div class="ask">
      <input id="fb" type="text" placeholder="request a change — try “keep the ums” or “remove the last 2 seconds”">
      <button class="go" id="apply">apply</button>
      <a class="btn" id="dl" download>download</a>
    </div>
    <div class="note" id="note"></div>

    <button class="link" id="again">start over</button>
  </section>

</main>

<footer><span id="msg">ready</span></footer>

<script src="app.js"></script>
</body>
</html>
